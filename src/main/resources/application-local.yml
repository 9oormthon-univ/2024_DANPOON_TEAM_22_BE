server:
  port: 8081

spring:
  application:
    name: naeilmolae-local

  datasource:
    config:
      import: classpath:application.yml

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul

  cloud:
    function:
      definition: analysisResponseConsumer
    stream:
      bindings:
        analysisResponseConsumer-in-0:
          destination: ${kafka.topic.analysis.response}
          group: analysis_response_group
          contentType: application/json
      kafka:
        binder:
          brokers: localhost:9092

logging:
  level:
    org.springframework.web: ERROR

sentry:
  enabled: false