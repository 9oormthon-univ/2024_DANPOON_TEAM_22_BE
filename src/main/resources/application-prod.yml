server:
  port: 8081

spring:
  application:
    name: naeilmolae-prod
  datasource:
    config:
      import: classpath:application.yml
    hikari:
      read-only: false

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul


logging:
  level:
    org.springframework.web: ERROR

sentry:
  enabled: true